<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>

    <link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Add Employee</h2>

        <form th:action="@{/save}"
              th:object="${employee}"
              method="post">

            <input type="text"
                   th:field="*{name}"
                   placeholder="Name"
                   class="form-control mb-3">

            <input type="email"
                   th:field="*{email}"
                   placeholder="Email"
                   class="form-control mb-3">

            <input type="text"
                   th:field="*{department}"
                   placeholder="Department"
                   class="form-control mb-3">

            <input type="number"
                   th:field="*{salary}"
                   placeholder="Salary"
                   class="form-control mb-3">

            <button class="btn btn-success">
                Save Employee
            </button>

        </form>

    </div>
</div>

</body>
</html>
